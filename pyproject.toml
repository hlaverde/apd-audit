[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apd"
version = "0.1.0"
description = "Auditing Algorithmic Pigmentocracy: empirical pipeline for the Latin-American APD study."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [
    { name = "Carlos Alfonso Laverde Rodríguez" },
    { name = "Yenny Katherine Parra Acosta" },
    { name = "Henry Laverde Rojas" },
]
keywords = ["pigmentocracy", "generative-ai", "bias-audit", "PERLA", "Latin-America"]

dependencies = [
    # data
    "pandas>=2.2,<3",
    "pyarrow>=15",
    "numpy>=1.26,<3",
    "scipy>=1.13",
    # config
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1",
    # net
    "requests>=2.32",
    "huggingface-hub>=0.25",
    # images
    "pillow>=10",
    "opencv-python>=4.9",
    "mediapipe>=0.10.14",
    # stats
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    # viz
    "matplotlib>=3.8",
    # docs / proposal reading
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "black>=24.4",
    "isort>=5.13",
    "pre-commit>=3.7",
    "nbstripout>=0.7",
]
# Optional heavyweight ML — only needed if HF Inference fails and we fall
# back to local diffusers. Install with `uv sync --extra ml`.
ml = [
    "torch>=2.2",
    "diffusers>=0.30",
    "transformers>=4.42",
    "accelerate>=0.33",
    "safetensors>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/apd"]

# ---------------- tooling --------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks", "data", "images", "results"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RET"]
ignore = ["E501"]  # line length handled by black

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = '''
/(
    notebooks/.*
  | data/.*
  | images/.*
  | results/.*
)/
'''

[tool.isort]
profile = "black"
line_length = 100
src_paths = ["src", "scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --tb=short"
markers = [
    "integration: end-to-end tests that exercise the POC pipeline (slower).",
    "network: tests that require network access.",
]
pythonpath = ["src"]
